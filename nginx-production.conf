# Production Nginx Configuration for hotline.jemwealth.co
# This combines production best practices with SSE/WebSocket support for Retell

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hotline.jemwealth.co;
    
    # For Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotline.jemwealth.co;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/hotline.jemwealth.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotline.jemwealth.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Root directory for React app (PRODUCTION: serve static files, not dev server)
    root /var/www/ai-hotline/build;
    index index.html;

    # Serve React app (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Backend (port 4000)
    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:4000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets caching (improves performance)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

